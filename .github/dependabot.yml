version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    # SDK-managed packages: these move when the Expo SDK upgrades (via
    # `expo install`), not via Dependabot. Bumping them ahead of the SDK pin
    # fails the `expo install --check` CI gate, so exclude them entirely.
    ignore:
      - dependency-name: "react"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-community/*"
      - dependency-name: "@react-native-picker/picker"
      - dependency-name: "nativewind"
      - dependency-name: "expo"
      - dependency-name: "expo-*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
