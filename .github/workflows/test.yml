name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-packages:
    name: Test Packages (shared, api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Test packages/shared
        run: pnpm --filter @repo/shared test
      - name: Test packages/api
        run: pnpm --filter @repo/api test

  test-server:
    name: Test Server (Integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Test apps/server
        run: pnpm --filter @app/server test

  test-devtools:
    name: Test Devtools (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Test apps/devtools
        run: pnpm --filter @app/devtools test

  typecheck:
    name: Typecheck (all workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Typecheck all workspaces
        run: pnpm -r typecheck

  test-mobile:
    name: Test Mobile (Jest + Typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Test apps/mobile
        run: pnpm --filter @app/mobile test
      - name: Typecheck apps/mobile
        run: pnpm --filter @app/mobile exec tsc --noEmit
      - name: Check Expo SDK compatibility
        run: pnpm --filter @app/mobile exec expo install --check

  build:
    name: Build All
    runs-on: ubuntu-latest
    needs: [test-packages, test-server, test-devtools, test-mobile, typecheck]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Build packages
        run: pnpm --filter @repo/shared build && pnpm --filter @repo/api build
      - name: Build server
        run: pnpm --filter @app/server build
      - name: Build devtools
        run: pnpm --filter @app/devtools build
