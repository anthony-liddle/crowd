name: Expo SDK Sync

# Expo publishes patch releases for its SDK-managed packages on its own
# cadence. Those packages are pinned exactly in apps/mobile/package.json and
# excluded from Dependabot, because they must move together with the SDK
# rather than individually. That means nothing else generates these bumps, so
# `expo install --check` drifts red on wall-clock time and takes the required
# Build All job down with it (see #137).
#
# This job runs `expo install --fix` weekly and opens a PR when it finds
# anything, which is the intended maintenance path for these packages.

on:
  schedule:
    # Mondays 09:00 UTC, ahead of the weekly Dependabot run
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync Expo SDK-managed packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install

      - name: Apply expo install --fix
        run: pnpm --filter @app/mobile exec expo install --fix

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- apps/mobile/package.json pnpm-lock.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "SDK-managed packages already in sync."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Verify before opening a PR, so a sync that breaks the app surfaces
      # here rather than as a red PR nobody wants to touch.
      - name: Verify mobile still builds
        if: steps.diff.outputs.changed == 'true'
        run: |
          pnpm --filter @app/mobile test
          pnpm --filter @app/mobile exec tsc --noEmit
          pnpm --filter @app/mobile exec expo install --check

      # Uses the gh CLI rather than a third-party action, to avoid granting
      # contents: write to another supply-chain dependency.
      #
      # A PR opened with the default GITHUB_TOKEN does not trigger other
      # workflows, so the required checks would never run and the PR would sit
      # unmergeable. Set EXPO_SYNC_TOKEN to a fine-grained PAT (contents: write,
      # pull-requests: write) to get CI on these PRs automatically. Without it
      # the PR is still opened correctly; close and reopen it to trigger checks.
      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.EXPO_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH=chore/expo-sdk-sync

          # Package diff, used only as PR body content. Written to a file
          # rather than an output variable so no delimiter can be forged.
          git diff --unified=0 -- apps/mobile/package.json \
            | grep -E '^[-+][[:space:]]+"' > /tmp/pkg-diff.txt || true

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add apps/mobile/package.json pnpm-lock.yaml
          git commit -m "chore(mobile): sync SDK-managed packages to Expo expected versions"
          git push --force origin "$BRANCH"

          {
            echo "Automated weekly sync of the Expo SDK-managed packages, generated by \`expo install --fix\`."
            echo
            echo "These packages are pinned exactly and excluded from Dependabot because they must move"
            echo "together with the SDK. Without this job nothing produces these bumps, and"
            echo '`expo install --check` drifts red over time - which silently skips the required'
            echo "**Build All** job, since it \`needs:\` Test Mobile."
            echo
            echo '### Packages changed'
            echo '```diff'
            cat /tmp/pkg-diff.txt
            echo '```'
            echo
            echo "Verified in CI before this PR was opened: mobile tests, \`tsc --noEmit\`, and \`expo install --check\`."
            echo
            echo "\`react-native\` and \`expo\` are runtime packages - worth a simulator smoke test"
            echo "before the next TestFlight build."
          } > /tmp/pr-body.md

          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --body-file /tmp/pr-body.md
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore(mobile): sync SDK-managed packages to Expo expected versions" \
              --body-file /tmp/pr-body.md \
              --label dependencies
          fi
